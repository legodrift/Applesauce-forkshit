name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build unsigned Applesauce IPA
    runs-on: macos-26

    steps:
      - name: Checkout ios-host
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ios-host

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install dependencies
        run: |
          brew install cmake ninja boost
          rustup target add aarch64-apple-ios
          rustup target add aarch64-apple-ios-sim

      - name: Set Boost path
        run: |
          echo "TOUCHHLE_BOOST_ROOT=$(brew --prefix boost)/include" >> "$GITHUB_ENV"

      - name: Build shared SDL for iPhoneOS
        run: |
          sh platform/ios/scripts/build-sdl-shared.sh iphoneos

      - name: Build Applesauce iOS host
        run: |
          sh platform/ios/scripts/build-host.sh iphoneos Release

      - name: Package unsigned IPA
        run: |
          sh platform/ios/scripts/package-ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Applesauce-iOS-unsigned
          path: |
            dist/Applesauce-iOS-unsigned.ipa
            dist/Applesauce-iOS-unsigned.ipa.sha256
